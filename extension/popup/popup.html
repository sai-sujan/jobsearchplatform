<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerOS</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <!-- Auth screen -->
    <div id="screen-auth" class="screen hidden">
      <div class="brand">
        <span class="brand-icon">🐾</span>
        <span class="brand-name">CareerOS</span>
      </div>
      <p class="brand-tagline">Sign in to save jobs &amp; autofill applications</p>
      <div class="form-group">
        <input id="input-username" type="text" placeholder="Username" autocomplete="username" />
      </div>
      <div class="form-group">
        <input id="input-password" type="password" placeholder="Password" autocomplete="current-password" />
      </div>
      <div id="auth-error" class="error-msg hidden"></div>
      <button id="btn-login" class="btn btn-primary">Sign in</button>
    </div>

    <!-- Main screen -->
    <div id="screen-main" class="screen hidden">
      <div class="header">
        <div class="brand-small">
          <span class="brand-icon">🐾</span>
          <span class="brand-name">CareerOS</span>
        </div>
        <div class="header-actions">
          <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
          <button id="btn-logout" class="icon-btn" title="Sign out">↩</button>
        </div>
      </div>

      <div class="user-info">
        <span id="user-greeting">Signed in</span>
      </div>

      <div class="action-buttons">
        <button id="btn-save-job" class="btn btn-primary btn-block">
          <span>⭐</span> Save this job
        </button>
        <button id="btn-autofill" class="btn btn-secondary btn-block">
          <span>⚡</span> Autofill application
        </button>
        <button id="btn-cover-letter" class="btn btn-ai btn-block">
          <span>📝</span> Generate cover letter
        </button>
      </div>

      <div id="save-feedback" class="feedback hidden"></div>

      <div class="divider"></div>

      <div class="recent-header">Recent saves</div>
      <div id="recent-jobs" class="recent-list">
        <div class="loading-text">Loading…</div>
      </div>

      <div class="divider"></div>

      <button id="btn-open-dashboard" class="btn btn-ghost btn-block">
        Open dashboard ↗
      </button>
    </div>

    <!-- Loading screen -->
    <div id="screen-loading" class="screen">
      <div class="loading-spinner">⏳</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
