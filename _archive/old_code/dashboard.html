<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        #fileInput {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .filters {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        select,
        input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid #667eea;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .job-card.perfect {
            border-left-color: #10b981;
        }

        .job-card.good {
            border-left-color: #f59e0b;
        }

        .job-card.skip {
            border-left-color: #ef4444;
            opacity: 0.7;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .job-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .job-company {
            font-size: 0.9rem;
            color: #666;
        }

        .score-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .job-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: #f3f4f6;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #666;
        }

        .skills-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .skills-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .job-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .job-link:hover {
            transform: scale(1.05);
        }

        .new-badge {
            background: #10b981;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .jobs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Job Search Dashboard</h1>
            <p style="color: #666;">Interactive visualization of your job search data</p>
        </div>

        <div class="upload-section">
            <h2 style="margin-bottom: 20px; color: #333;">Upload jobs_master.xlsx</h2>
            <input type="file" id="fileInput" accept=".xlsx" />
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                📁 Choose Excel File
            </button>
            <p style="margin-top: 15px; color: #666; font-size: 0.9rem;">
                Select your jobs_master.xlsx file to visualize the data
            </p>
        </div>

        <div id="dashboard" class="hidden">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Jobs</div>
                    <div class="stat-value" id="totalJobs">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Good Matches (70%+)</div>
                    <div class="stat-value" id="goodMatches">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Perfect Matches (90%+)</div>
                    <div class="stat-value" id="perfectMatches">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Passed Filters</div>
                    <div class="stat-value" id="passedFilters">0</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">Skill Score Distribution</div>
                    <canvas id="scoreChart"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Jobs by Tier</div>
                    <canvas id="tierChart"></canvas>
                </div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">Filter by Tier</label>
                    <select id="tierFilter">
                        <option value="all">All Tiers</option>
                        <option value="perfect">🟢 Perfect Match</option>
                        <option value="good">🟡 Good Match</option>
                        <option value="stretch">🟠 Stretch Goal</option>
                        <option value="skip">🔴 Skip</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Minimum Score</label>
                    <input type="number" id="minScore" placeholder="0" min="0" max="100">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <input type="text" id="searchBox" placeholder="Search jobs...">
                </div>
            </div>

            <div class="jobs-grid" id="jobsGrid"></div>
        </div>
    </div>

    <script>
        let allJobs = [];
        let filteredJobs = [];
        let scoreChart, tierChart;

        document.getElementById('fileInput').addEventListener('change', handleFile);

        function handleFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                // Read "All Jobs" sheet
                const worksheet = workbook.Sheets['All Jobs'];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                allJobs = jsonData;
                filteredJobs = allJobs;

                // Show dashboard
                document.getElementById('dashboard').classList.remove('hidden');
                document.querySelector('.upload-section').classList.add('hidden');

                // Update stats
                updateStats();

                // Create charts
                createCharts();

                // Display jobs
                displayJobs(filteredJobs);

                // Add event listeners
                document.getElementById('tierFilter').addEventListener('change', filterJobs);
                document.getElementById('minScore').addEventListener('input', filterJobs);
                document.getElementById('searchBox').addEventListener('input', filterJobs);
            };

            reader.readAsArrayBuffer(file);
        }

        function updateStats() {
            const total = allJobs.length;
            const goodMatches = allJobs.filter(j => (j['Skill Score'] || 0) >= 70).length;
            const perfectMatches = allJobs.filter(j => (j['Skill Score'] || 0) >= 90).length;
            const passedFilters = allJobs.filter(j => j.Verdict === 'YES').length;

            document.getElementById('totalJobs').textContent = total;
            document.getElementById('goodMatches').textContent = goodMatches;
            document.getElementById('perfectMatches').textContent = perfectMatches;
            document.getElementById('passedFilters').textContent = passedFilters;
        }

        function createCharts() {
            // Score distribution chart
            const scores = allJobs.map(j => j['Skill Score'] || 0);
            const bins = [0, 30, 50, 70, 90, 100];
            const counts = bins.slice(0, -1).map((bin, i) => {
                return scores.filter(s => s >= bin && s < bins[i + 1]).length;
            });

            const scoreCtx = document.getElementById('scoreChart').getContext('2d');
            if (scoreChart) scoreChart.destroy();
            scoreChart = new Chart(scoreCtx, {
                type: 'bar',
                data: {
                    labels: ['0-30%', '30-50%', '50-70%', '70-90%', '90-100%'],
                    datasets: [{
                        label: 'Number of Jobs',
                        data: counts,
                        backgroundColor: [
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(251, 146, 60, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(16, 185, 129, 0.8)'
                        ],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Tier chart
            const tiers = allJobs.map(j => j.Tier || '');
            const tierCounts = {
                'Perfect': tiers.filter(t => t.includes('🟢')).length,
                'Good': tiers.filter(t => t.includes('🟡')).length,
                'Stretch': tiers.filter(t => t.includes('🟠')).length,
                'Skip': tiers.filter(t => t.includes('🔴')).length
            };

            const tierCtx = document.getElementById('tierChart').getContext('2d');
            if (tierChart) tierChart.destroy();
            tierChart = new Chart(tierCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(tierCounts),
                    datasets: [{
                        data: Object.values(tierCounts),
                        backgroundColor: [
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(251, 146, 60, 0.8)',
                            'rgba(239, 68, 68, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function filterJobs() {
            const tierFilter = document.getElementById('tierFilter').value;
            const minScore = parseInt(document.getElementById('minScore').value) || 0;
            const searchText = document.getElementById('searchBox').value.toLowerCase();

            filteredJobs = allJobs.filter(job => {
                // Tier filter
                if (tierFilter !== 'all') {
                    const tier = job.Tier || '';
                    if (tierFilter === 'perfect' && !tier.includes('🟢')) return false;
                    if (tierFilter === 'good' && !tier.includes('🟡')) return false;
                    if (tierFilter === 'stretch' && !tier.includes('🟠')) return false;
                    if (tierFilter === 'skip' && !tier.includes('🔴')) return false;
                }

                // Score filter
                if ((job['Skill Score'] || 0) < minScore) return false;

                // Search filter
                if (searchText) {
                    const title = (job.Title || '').toLowerCase();
                    const company = (job.Company || '').toLowerCase();
                    const skills = (job['Matched Skills'] || '').toLowerCase();
                    if (!title.includes(searchText) && !company.includes(searchText) && !skills.includes(searchText)) {
                        return false;
                    }
                }

                return true;
            });

            displayJobs(filteredJobs);
        }

        function displayJobs(jobs) {
            const grid = document.getElementById('jobsGrid');

            if (jobs.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: white; font-size: 1.2rem;">No jobs match your filters</div>';
                return;
            }

            grid.innerHTML = jobs.map(job => {
                const tier = job.Tier || '';
                let cardClass = 'job-card';
                if (tier.includes('🟢')) cardClass += ' perfect';
                else if (tier.includes('🟡')) cardClass += ' good';
                else if (tier.includes('🔴')) cardClass += ' skip';

                const matchedSkills = (job['Matched Skills'] || '').split(',').slice(0, 5).filter(s => s.trim());
                const isNew = job.New === '✨ NEW';

                return `
                    <div class="${cardClass}">
                        <div class="job-header">
                            <div>
                                <div class="job-title">${job.Title || 'Unknown'}</div>
                                <div class="job-company">${job.Company || 'Unknown'}</div>
                            </div>
                            <div class="score-badge">${job['Skill Score'] || 0}%</div>
                        </div>
                        <div class="job-meta">
                            ${isNew ? '<span class="new-badge">✨ NEW</span>' : ''}
                            <span class="meta-tag">${job.Match || '0/0'} skills</span>
                            <span class="meta-tag">${job.Location || 'Remote'}</span>
                        </div>
                        ${matchedSkills.length > 0 ? `
                            <div class="skills-section">
                                <div class="skills-label">Matched Skills:</div>
                                <div class="skills-list">
                                    ${matchedSkills.map(s => `<span class="skill-tag">${s.trim()}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                        <a href="${job.Link || '#'}" target="_blank" class="job-link">View Job →</a>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>

</html>
